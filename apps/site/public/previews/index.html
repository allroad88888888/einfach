<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Einfach 首页方向预览</title>
    <style>
      :root {
        color: #182018;
        background: #f4f6ef;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      main {
        width: min(960px, calc(100% - 40px));
        margin: 0 auto;
        padding: 80px 0;
      }
      .eyebrow {
        color: #4b7c39;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.14em;
      }
      h1 {
        max-width: 700px;
        margin: 12px 0 16px;
        font-size: clamp(42px, 7vw, 72px);
        line-height: 0.98;
        letter-spacing: -0.07em;
      }
      p {
        color: #5c675c;
        font-size: 17px;
        line-height: 1.7;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-top: 46px;
      }
      a {
        min-height: 270px;
        padding: 24px;
        color: inherit;
        text-decoration: none;
        border: 1px solid #cfd6cb;
        border-radius: 16px;
        transition:
          transform 0.18s ease,
          box-shadow 0.18s ease;
      }
      a:hover {
        transform: translateY(-5px);
        box-shadow: 0 18px 38px rgba(22, 39, 21, 0.13);
      }
      .swatch {
        display: block;
        height: 116px;
        margin-bottom: 28px;
        border-radius: 10px;
      }
      .lab .swatch {
        background: radial-gradient(circle at 75% 15%, #b6ff53, transparent 24%), #111712;
      }
      .paper .swatch {
        background: linear-gradient(135deg, #f5efdf 0 60%, #dd4f37 60%);
      }
      .console .swatch {
        background: linear-gradient(135deg, #eff7ff 0 54%, #286cff 54% 56%, #06162f 56%);
      }
      h2 {
        margin: 0;
        font-size: 22px;
        letter-spacing: -0.04em;
      }
      a p {
        margin-bottom: 0;
        font-size: 14px;
      }
      @media (max-width: 680px) {
        .grid {
          grid-template-columns: 1fr;
        }
        a {
          min-height: auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="eyebrow">EINFACH / STATIC DIRECTIONS</span>
      <h1>先选气质，<br />再做官网。</h1>
      <p>三张纯静态首页提案，信息一致、表现方式不同。请选择最接近你想让 Einfach 被感知到的样子。</p>
      <div class="grid">
        <a class="lab" href="./atom-lab.html">
          <span class="swatch"></span>
          <h2>A / 原子实验室</h2>
          <p>深色、高对比、带一点开源工具的锋利感。</p>
        </a>
        <a class="paper" href="./signal-paper.html">
          <span class="swatch"></span>
          <h2>B / 编辑式文档</h2>
          <p>温暖、克制，优先建立可信赖的阅读体验。</p>
        </a>
        <a class="console" href="./flow-console.html">
          <span class="swatch"></span>
          <h2>C / 技术控制台</h2>
          <p>冷静、结构化，突出框架能力与 API 导览。</p>
        </a>
      </div>
    </main>
  </body>
</html>
